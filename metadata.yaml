name: astrbot_plugin_master_aware
display_name: 认主
short_desc: 识别主人 QQ，在对话里单独对待
desc: >-
  让机器人认得「谁在跟自己说话」。
  模型本身看不到发送者的 QQ 号，所以人格里写再多「主人是谁」也不起作用；
  这个插件在每次 LLM 请求前比对发送者 QQ，命中名单就注入身份说明，
  并把提示贴到当前用户消息前面，避免被长 system prompt 末尾和人设里的傲娇话术淹没。
  支持多个主人、自定义说明文案、可选调试日志。
version: 2.1.0
author: 大肥鱼
repo: https://github.com/QuanWander/astrbot_plugin_master_aware
astrbot_version: ">=4.17.0"
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
tags:
  - 身份
  - 主人
  - 人格
